<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Sigmar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Portfolio</title>
</head>
<body>
    
    <header class="header">
        <div class="main__menu">
            <a href="#" class="logo">
                <img src="./image/SVGCelesteVeka.svg" alt="veka">
            </a>
            <nav class="menu">
                <ul class="menu__list">
                    <li>
                        <a href="#">Inicio</a>
                        <a href="#">Sobre mi</a>
                        <a href="#">Portfolio</a>
                    </li>
                </ul>
            </nav>
            <button class="button">Contáctame</button>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="hero__banner">
                <h1 class="hero__title">Diseño e ilustración únicas y divertidas para marcas listas a escalar</h1>
                <p class="hero__desc">Bienvenido a mi mundo, donde lo extravagante se une a lo atrevido y las identidades de marca vibrantes cobran vida.</p>
            </div>
            <button class="button"></button>
        </section>

        <section class="space">
            <ul class="space__points">
                <li class="space__info">Diseñadora</li>
                <li class="space__info">Creatividad</li>
                <li class="space__info">Enstusiasmo</li>
                <li class="space__info">Estrategia</li>
                <li class="space__info">Innovación</li>
            </ul>
        </section>

        <section class="about">
            <div class="about__info">
                <h2 class="about__title"></h2>
                <p class="about__desc"></p>
                <p class="about__desc"></p>
                <button class="button"></button>
            </div>
            <img class="about__img" src="./image/veka.jpg" alt="">
        </section>

        <section class="quote">
            <h2 class="quote__title"></h2>
        </section>

        <section class="projects">
            
        </section>







    </main>
